<html>

<head>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: azure;
            padding: 30px;
            text-align: center;
        }
        h1{
            color: black;
        }
        h1+p{
            background-color: rgb(236, 155, 48);
            padding: 10px 20px ;
            border-radius: 8px ;
            color: rgb(247, 96, 9);
            display: inline-block;
        }
        ul{
            padding: 0;
            margin-top: 20px;
        }
        ul>li{
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: black;
            padding: 10px 20px;
            margin: 6px auto; 
            width: 250px;
            background-color:bisque ;
            border-radius: 8px;

        }
        ul li:nth-child(4){
            background: orangered;
            color: azure;
        }
        .desc {

color: #555;

margin-top: 20px;

font-size: 15px;

max-width: 400px;

margin-left: auto;

margin-right: auto;

}

/* first-letter - makes the first letter big and bold */

.desc::first-letter {

font-size: 220%;

color: #e65c00;

font-weight: bold;

}

.links { margin-top: 25px; }

/* Hover Effect - links glow when mouse moves over them */

a {

color: #e65c00;

text-decoration: none;

font-size: 15px;

margin: 0 12px;

padding: 8px 18px;

border: 2px solid #e65c00;

border-radius: 8px;

}

a:hover {

background: #e65c00;

color: white;

}
    </style>
</head>

<body>

    <h1>My food menu</h1>
    <p>Pick your favorite food and dig in</p>

    <ul>
        <li>Pizza</li>
        <li>Noodles</li>
        <li>fish</li>
        <li>Fried chicken</li>
        <li>Shawrma</li>
    </ul>

    <p class="desc">Every dish in this menu is made with love
        and loads of flavours.try them all and find your favorite!
    </p>

    <div class="links">
        <a href="#">Order now</a>
    </div>
</body>
</html>
